/* "Autosize" fits a column to the widest value in the rows that are loaded.
   With real data this is the same question as fit-to-content: on a paginated
   table it can only ever measure the current page. */
/* Fit to the widest value in the rows on screen, or to the header, whichever is
   wider — the same thing Excel does when you double-click a column edge. It can
   only measure what is loaded, which is why it reads the rows on this page
   rather than a fixed number. */
/* Autofit has to be tight or it does nothing visible. The old estimate padded
   the header so generously that the answer landed within a few pixels of the
   default width for most columns — double-clicking appeared to do nothing.
   These are the real measurements: what the cell needs, and what the header
   furniture needs. */
const W_MIN = 84, W_MAX = 420;
const CELL_PAD = 24;                      // 12 either side
const TH_FURNITURE = 47;                  // padding, grip, sort icon and their gaps
const TH_PIN_EXTRA = 26;                  // the pin marker on a pinned column, and its gap
function naturalWidth(id) { return F[id].defaultWidth; }
function headerNeed(id) {
  return textWidth(lab(id), '600 ' + (FONT_PX - 1) + 'px') + TH_FURNITURE +
    (pinnedList().indexOf(id) !== -1 ? TH_PIN_EXTRA : 0);
}
/* the width a cell's text actually needs, measured in the table's own font */
let measureCtx = null;
function textWidth(t, font) {
  if (!measureCtx) measureCtx = document.createElement('canvas').getContext('2d');
  measureCtx.font = (font || FONT_PX + 'px') + ' ' + getComputedStyle(document.body).fontFamily;
  return Math.ceil(measureCtx.measureText(t).width);
}
function fittedWidth(id) {
  let widest = 0;
  pageRowIds().forEach(r => { widest = Math.max(widest, textWidth(cellText(r, id))); });
  return Math.max(W_MIN, Math.min(W_MAX, Math.max(widest + CELL_PAD + 2, headerNeed(id))));
}
function autosizeColumn(id) {
  const cols = tableColumns();
  const idx = cols.findIndex(c => c.id === id);
  if (idx === -1 || cols[idx].collapsed) return;
  const want = fittedWidth(id, idx);
  const from = cols[idx].width;
  if (Math.abs(want - from) < 2) {
    snapWidth(id, from + (want > from ? 6 : -6), from);   // a nudge, so the double-click visibly registered
    return announce(lab(id) + ' is already fitted to its content');
  }
  setWidth(id, want);
  snapWidth(id, from, want);
}
/** ease a column from one width to another, after the table has been redrawn at the new one */
function snapWidth(id, from, to) {
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || !document.body.animate) return;
  const th = document.querySelector('.headrow th[data-col="' + id + '"]');
  if (!th) return;
  const col = Array.prototype.indexOf.call(th.parentNode.children, th);
  const opts = { duration: 180, easing: 'cubic-bezier(.2,.8,.3,1.15)' };
  th.animate([{ width: from + 'px' }, { width: to + 'px' }], opts);
  document.querySelectorAll('tbody tr').forEach(tr => {
    const cv = tr.children[col] && tr.children[col].querySelector('.cv');
    if (cv) cv.animate([{ width: (from - 24) + 'px' }, { width: (to - 24) + 'px' }], opts);
  });
}
function autosizeAll() {
  const cols = tableColumns().filter(c => !c.collapsed);
  const next = {};
  cols.forEach((c, idx) => { next[c.id] = fittedWidth(c.id, idx); });
  change('Autosized all ' + cols.length + ' columns', d => {
    Object.keys(next).forEach(k => { d.widths[k] = next[k]; });
  });
}

/* Group-level versions of the same actions. Each one is a single change. */
function groupCols(cid) { return catFields(cid).filter(id => visibleOf(id)); }
function groupUnpinned(cid) {
  const pins = pinnedList();
  return groupCols(cid).filter(id => pins.indexOf(id) === -1);
}
function groupPinned(cid) {
  const pins = pinnedList();
  return pins.filter(id => F[id].cat === cid);
}
function pinGroup(cid) {
  const add = groupUnpinned(cid);
  if (!add.length) return;
  const pins = pinnedList();
  change('Pinned the ' + catName(cid) + ' group', d => { d.pinned = pins.concat(add); });
}
function unpinGroup(cid) {
  const drop = groupPinned(cid);
  if (!drop.length) return;
  const pins = pinnedList().filter(id => drop.indexOf(id) === -1);
  change('Unpinned the ' + catName(cid) + ' group', d => { d.pinned = pins; });
}
function hideGroupColumns(cid) {
  const all = groupCols(cid);
  const targets = all.filter(id => !F[id].required);
  if (!targets.length) return;
  const skipped = all.length - targets.length;
  change('Hid ' + (skipped ? 'the optional columns' : 'every column') + ' in ' + catName(cid),
    d => { targets.forEach(id => { d.vis[id] = false; }); });
}
function autosizeGroup(cid) {
  const cols = tableColumns();
  const mine = cols.filter(c => !c.collapsed && (c.cat === cid || (c.pinned && F[c.id].cat === cid)));
  if (!mine.length) return;
  const next = {};
  mine.forEach(c => { next[c.id] = fittedWidth(c.id, cols.findIndex(x => x.id === c.id)); });
  change('Autosized the ' + catName(cid) + ' group', d => {
    Object.keys(next).forEach(k => { d.widths[k] = next[k]; });
  });
}

/* ---------- the group header menu ---------- */
function renderGrpMenu() {
  const gm = S.grpMenu;
  if (!gm || !catName(gm.cid)) return null;
  const cid = gm.cid;
  const order = catOrder();
  const at = order.indexOf(cid);
  const cols = groupCols(cid);
  const unpinned = groupUnpinned(cid);
  const pinnedHere = groupPinned(cid);

  const m = el('<div class="colmenu" role="menu" style="left:' + gm.x + 'px;top:' + gm.y + 'px"></div>');
  m.onclick = e => e.stopPropagation();
  m.appendChild(el('<div class="hdr">' + esc(catName(cid)) + ' group · ' + cols.length +
    ' column' + (cols.length === 1 ? '' : 's') + '</div>'));
  const close = () => { S.grpMenu = null; };
  const item = (icon, label, opts) => {
    const o = opts || {};
    const b = el('<button class="mi ' + (o.on ? 'on' : '') + '" role="menuitem"' +
      (o.disabled ? ' disabled' : '') + (o.title ? ' title="' + esc(o.title) + '"' : '') + '>' +
      '<span class="ic">' + (icon || '') + '</span><span class="lb">' + esc(label) + '</span>' +
      (o.note ? '<span class="mnote">' + esc(o.note) + '</span>' : '') +
      (o.tick ? '<span class="tick">✓</span>' : '') +
      (o.chev ? '<span class="chev">' + (o.on ? '⌄' : '›') + '</span>' : '') + '</button>');
    if (!o.disabled && o.fn) b.onclick = () => o.fn();
    m.appendChild(b);
    return b;
  };

  if (unpinned.length) {
    item(ICON.pin(false), 'Pin to the left' + (unpinned.length > 1 ? ' — ' + unpinned.length + ' columns' : ''), {
      title:'Holds every showing column in this group at the left edge, in its current order',
      fn: () => { close(); pinGroup(cid); } });
  }
  if (pinnedHere.length) {
    item(ICON.pin(true), 'Unpin' + (pinnedHere.length > 1 ? ' — ' + pinnedHere.length + ' columns' : ''), {
      disabled: catIsHidden(cid),
      title: catIsHidden(cid)
        ? 'The group is hidden, so unpinning would make these columns disappear'
        : 'Returns them to ' + catName(cid),
      fn: () => { close(); unpinGroup(cid); } });
  }

  item(ICON.eye(false), 'Hide column group', { disabled: !catCanHide(cid),
    title: catCanHide(cid) ? 'Removes the whole group from the table'
                           : catName(cid) + ' holds a required column, so the group cannot be hidden',
    fn: () => { close(); toggleCategory(cid); } });
  const optional = cols.filter(id => !F[id].required);
  if (!catCanHide(cid)) {
    // the group itself cannot be hidden, so this is the only way to clear it down
    item('', 'Hide all optional columns', { disabled: !optional.length,
      title: optional.length
        ? 'Hides the ' + optional.length + ' column' + (optional.length === 1 ? '' : 's') +
          ' that are not required, and keeps the rest'
        : 'Every column in ' + catName(cid) + ' is required',
      fn: () => { close(); hideGroupColumns(cid); } });
  }

  m.appendChild(el('<div class="sep"></div>'));
  const shownHere = groupShowing(cid);
  if (!groupAllCollapsed(cid)) {
    item('', 'Collapse group', { disabled: !shownHere.length,
      title:'Narrows every column in ' + catName(cid) + ' to a strip. Its place in the table is kept.',
      fn: () => { close(); setGroupCollapsed(cid, true); } });
  }
  if (groupAnyCollapsed(cid)) {
    item('', 'Expand group', { title:'Opens every collapsed column in ' + catName(cid) + ' back out',
      fn: () => { close(); setGroupCollapsed(cid, false); } });
  }

  m.appendChild(el('<div class="sep"></div>'));

  item('', 'Move group left', { disabled: at <= 0, fn: () => { close(); moveCategory(cid, -1); } });
  item('', 'Move group right', { disabled: at === -1 || at >= order.length - 1,
    fn: () => { close(); moveCategory(cid, 1); } });

  m.appendChild(el('<div class="sep"></div>'));
  item('', 'Turn off column groups', {
    title:'Removes the group bands and lets any column go anywhere. Your grouped arrangement is kept, ' +
          'so turning groups back on restores it.',
    fn: () => { close(); toggleGrouping(); } });

  m.appendChild(el('<div class="sep"></div>'));
  item('', 'Autosize group', { disabled: !cols.length, fn: () => { close(); autosizeGroup(cid); } });
  item('', 'Autosize all columns', { fn: () => { close(); autosizeAll(); } });

  return m;
}

/* ---------- the column header menu ---------- */
function renderColMenu() {
  const cm = S.colMenu;
  if (!cm || !F[cm.id]) return null;
  const id = cm.id, f = F[id];
  const pins = pinnedList();
  const isPin = pins.indexOf(id) !== -1;

  const m = el('<div class="colmenu" role="menu" style="left:' + cm.x + 'px;top:' + cm.y + 'px"></div>');
  m.onclick = e => e.stopPropagation();
  m.appendChild(el('<div class="hdr">' + esc(lab(f.id)) + '</div>'));
  const close = () => { S.colMenu = null; };
  const item = (icon, label, opts) => {
    const o = opts || {};
    const b = el('<button class="mi ' + (o.on ? 'on' : '') + '" role="menuitem"' +
      (o.disabled ? ' disabled' : '') + (o.title ? ' title="' + esc(o.title) + '"' : '') + '>' +
      '<span class="ic">' + (icon || '') + '</span><span class="lb">' + esc(label) + '</span>' +
      (o.note ? '<span class="mnote">' + esc(o.note) + '</span>' : '') +
      (o.tick ? '<span class="tick">✓</span>' : '') +
      (o.chev ? '<span class="chev">' + (o.on ? '⌄' : '›') + '</span>' : '') + '</button>');
    if (!o.disabled && o.fn) b.onclick = () => o.fn();
    m.appendChild(b);
    return b;
  };

  if (isPin) {
    const cu = canUnpin(id);
    item(ICON.pin(true), 'Unpin', { disabled: !cu.ok,
      title: cu.ok ? 'Returns it to ' + (isGrouped() ? catName(f.cat) : 'the table') : cu.why,
      fn: () => { close(); togglePin(id); } });
    if (cu.hiddenGroup) {
      item('', 'Show ' + catName(f.cat) + ' and unpin', {
        title: 'Brings the group back and returns ' + lab(f.id) + ' to it, as one change',
        fn: () => { close(); showGroupAndUnpin(id); } });
    }
  } else {
    item(ICON.pin(false), 'Pin to the left', {
      title:'Held at the left edge as the rest of the table scrolls' +
        (isGrouped() ? ', outside ' + catName(f.cat) : ''),
      fn: () => { close(); togglePin(id); } });
  }

  item(ICON.eye(false), 'Hide column', { disabled: f.required,
    title: f.required ? f.label + ' is required and cannot be hidden'
                      : 'Takes it off the table. “Hidden · bring back” unhides it.',
    fn: () => { close(); setVisible(id, false); } });
  if (isGrouped()) item(ICON.eye(false), 'Hide column group', { note: catName(f.cat), disabled: !catCanHide(f.cat) || isPin,
    title: isPin ? 'This column is pinned, so it sits outside its group'
                 : (catCanHide(f.cat) ? 'Hides every column in ' + catName(f.cat)
                                      : catName(f.cat) + ' holds a required column, so it cannot be hidden'),
    fn: () => { close(); toggleCategory(f.cat); } });

  m.appendChild(el('<div class="sep"></div>'));
  const col = isCollapsed(id);
  item('', col ? 'Expand column' : 'Collapse column', {
    title: col ? 'Opens ' + lab(id) + ' back out to its full width'
               : 'Narrows ' + lab(id) + ' to a strip with its title running down it',
    fn: () => { close(); setCollapsed(id, !col); } });
  if (isGrouped() && !isPin) {
    const gAll = groupAllCollapsed(f.cat);
    item('', (gAll ? 'Expand' : 'Collapse') + ' the ' + catName(f.cat) + ' group', {
      fn: () => { close(); setGroupCollapsed(f.cat, !gAll); } });
  }

  m.appendChild(el('<div class="sep"></div>'));
  if (!isGrouped()) {
    item('', 'Turn column groups on', {
      title:'Puts the columns back into ' + CATS.slice(0,3).map(c => c.name).join(', ') +
            ' and the rest, in the arrangement you had before',
      fn: () => { close(); toggleGrouping(); } });
  } else {
    item('', 'Turn off column groups', {
      title:'Removes the group bands and lets any column go anywhere. Your grouped arrangement is kept.',
      fn: () => { close(); toggleGrouping(); } });
  }

  m.appendChild(el('<div class="sep"></div>'));
  item('', 'Autosize column', { disabled: col, title: col ? 'Expand it first' : '',
    fn: () => { close(); autosizeColumn(id); } });
  item('', 'Autosize all columns', { fn: () => { close(); autosizeAll(); } });

  return m;
}

/* The row-select column is not a column in the sense the rest of this file means.
   It is not in the field catalogue, and it cannot be hidden,
   moved, pinned or resized. It is a fixed frame the table is drawn inside, held
   at the far left of everything including the pinned block. */
const ROWS = 12;
const SEL_BASE = 44;
function selWidth() { return SEL_BASE; }
function isRowSelected(i) { return S.selected.indexOf(i) !== -1; }
function toggleRow(i) {
  const at = S.selected.indexOf(i);
  if (at === -1) S.selected.push(i); else S.selected.splice(at, 1);
  commit(S.selected.length + ' row' + (S.selected.length === 1 ? '' : 's') + ' selected');
}
function pageRowIds() {
  const start = pageIndex() * pageSize();
  return viewRows().slice(start, start + rowsOnPage());
}
function toggleAllRows() {
  const ids = pageRowIds();
  const allOn = ids.length && ids.every(i => S.selected.indexOf(i) !== -1);
  S.selected = allOn ? S.selected.filter(i => ids.indexOf(i) === -1)
                     : S.selected.concat(ids.filter(i => S.selected.indexOf(i) === -1));
  commit(S.selected.length ? S.selected.length + ' rows selected' : 'Selection cleared');
}
function selectAllState() {
  const ids = pageRowIds();
  const on = ids.filter(i => S.selected.indexOf(i) !== -1).length;
  if (!on) return 'none';
  return on === ids.length ? 'all' : 'some';
}

/* ---------- table ---------- */
let drag = null;   // { fid, x, y, overId, ok }
let resizing = null;
let lastEdgeClick = null;   // { id, t } — the first half of a double-click on a column edge

function renderTable() {
  const cols = tableColumns();
  const pins = pinnedList();
  const wrap = el('<div class="content"></div>');

  if (!cols.length) {
    const e = el('<div class="scrollwrap" style="padding:48px;text-align:center;color:#737373"></div>');
    e.appendChild(el('<p>Every column is hidden.</p>'));
    const b = el('<button class="btn primary">Bring every column back</button>');
    b.onclick = () => showEverything();
    e.appendChild(b); wrap.appendChild(e); return wrap;
  }

  /* the bar only appears when something is out of the table */
  if (hiddenCount()) {
    const vb = el('<div class="viewbar"></div>');
    vb.appendChild(el('<span class="vbl">' + TOTAL_ROWS + ' rows</span>'));
    const n = hiddenCount();
    const hb = el('<button class="hidchip">' + n + ' hidden · bring back</button>');
    hb.title = n + ' column' + (n === 1 ? '' : 's') +
      ' currently out of the table. Opens the list of hidden columns, where one click brings any of them back.';
    hb.onclick = () => openModal();
    vb.appendChild(hb);
    wrap.appendChild(vb);
  }

  const sw = el('<div class="scrollwrap"></div>');
  const sc = el('<div class="scroller" data-scroll="table"></div>');

  // group runs for the band row
  const runs = [];
  cols.forEach(c => {
    const key = c.pinned ? '__pinned' : c.cat;
    const last = runs[runs.length-1];
    if (last && last.key === key) { last.cols.push(c); last.w += c.width; }
    else runs.push({ key, cols:[c], w:c.width });
  });

  const SELW = selWidth();
  const selStyle = 'width:' + SELW + 'px;min-width:' + SELW + 'px;max-width:' + SELW + 'px';
  const leftOf = {};
  let stick = SELW;
  cols.forEach(c => { if (c.pinned) { leftOf[c.id] = stick; stick += c.width; } });

  let html = '<table><caption class="sr">Films, ' + cols.length + ' of ' + totalCount() + ' columns</caption><thead>';
  const grouped = isGrouped();
  if (grouped) {
  html += '<tr class="bandrow"><th class="selcell" style="' + selStyle + '" aria-hidden="true"></th>';
  runs.forEach((r, i) => {
    const pinned = r.key === '__pinned';
    const canHide = !pinned && catCanHide(r.key);
    html += '<th colspan="' + r.cols.length + '" class="' + (pinned ? 'pinband pinedge' : '') +
      '"' + (pinned ? ' style="left:' + SELW + 'px"' : ' title="Right-click for group options"') +
      ' data-band="' + r.key + '"><span class="band-in" style="width:' + Math.max(0, r.w - 17) + 'px">' +
      (pinned ? '' : '<span class="bgrab" data-bgrab="' + r.key + '" aria-hidden="true" title="Drag to move the ' +
        esc(catName(r.key)) + ' group. It cannot go left of the pinned columns.">' + ICON.grip + '</span>') +
      '<span class="bname">' + (pinned ? esc('Pinned to the left') : esc(catName(r.key))) + '</span>' +
      '</span></th>';
  });
  html += '</tr>';
  }
  const selState = selectAllState();
  html += '<tr class="headrow"><th class="selcell" style="' + selStyle + '" scope="col">' +
    '<span class="selinner"><button class="rowbox ' +
    (selState === 'all' ? 'on' : selState === 'some' ? 'some' : '') +
    '" data-selall="1" role="checkbox" aria-checked="' +
    (selState === 'all' ? 'true' : selState === 'some' ? 'mixed' : 'false') +
    '" aria-label="Select all rows" title="' +
    (selState === 'none' ? 'Select all rows' : 'Clear the selection') + '">' +
    (selState === 'all' ? '✓' : '') + '</button></span></th>';
  cols.forEach((c, i) => {
    const isPin = c.pinned;
    const lastPin = isPin && (!cols[i+1] || !cols[i+1].pinned);
    if (c.collapsed) {
      html += '<th style="width:' + c.width + 'px' + (isPin ? ';left:' + leftOf[c.id] + 'px' : '') +
        '" data-col="' + c.id + '" class="collapsed ' + (isPin ? 'pinned ' : '') + (lastPin ? 'pinedge' : '') + '">' +
        '<span class="cin">' +
          '<span class="grab" data-grab="' + c.id + '" aria-hidden="true" title="Drag to move ' + esc(lab(c.id)) + '">' +
            ICON.grip + '</span>' +
          '<button class="cexp" data-expand="' + c.id + '" aria-label="Expand ' + esc(lab(c.id)) +
            '" title="Expand ' + esc(lab(c.id)) + '. Right-click for more options.">' +
            '<span class="chev" aria-hidden="true">›</span></button>' +
        '</span></th>';
      return;
    }
    const sorted = sortDirOf(c.id);
    const sortTip = 'Sort ' + esc(lab(c.id)) + (sorted === null ? ' ascending' : sorted === 'asc' ? ' descending' : ' — back to the original order') +
      '. Right-click for more options.';
    html += '<th style="width:' + c.width + 'px' +
      (isPin ? ';left:' + leftOf[c.id] + 'px' : '') + '" data-col="' + c.id + '" class="' +
      (isPin ? 'pinned ' : '') + (lastPin ? 'pinedge ' : '') + (sorted ? 'sorted' : '') + '"' +
      (sorted ? ' aria-sort="' + (sorted === 'asc' ? 'ascending' : 'descending') + '"' : '') + '>' +
      '<span class="th-in">' +
        '<span class="grab" data-grab="' + c.id + '" aria-hidden="true" title="Drag to move ' +
          esc(lab(c.id)) + (isPin ? ' within the pinned columns'
            : (grouped ? ' within ' + esc(catName(c.cat)) + ' — it cannot leave its group or join the pinned columns'
                       : ' anywhere in the table — it cannot join the pinned columns')) + '">' + ICON.grip + '</span>' +
        '<button class="lbl" data-sort="' + c.id + '" aria-haspopup="menu" title="' + sortTip + '">' +
          esc(lab(c.id)) + '</button>' +
        '<button class="sortbtn' + (sorted ? ' active' : '') + '" data-sort="' + c.id + '" tabindex="-1" ' +
          'aria-hidden="true" title="' + sortTip + '">' + ICON.sort(sorted) + '</button>' +
        (isPin ? '<span class="acts">' : '') +
          (isPin
            ? '<button class="iconbtn on" data-unpin="' + c.id + '"' +
              (canUnpin(c.id).ok ? '' : ' disabled') +
              ' aria-label="Unpin ' + esc(lab(c.id)) + '" title="' +
              (canUnpin(c.id).ok
                ? 'Pinned to the left. Click to unpin and return it to ' +
                  (grouped ? esc(catName(F[c.id].cat)) : 'the table') + '.'
                : esc(canUnpin(c.id).why)) +
              '">' + ICON.pin(true) + '</button>'
            : '') +
        (isPin ? '</span>' : '') +
      '</span><span class="rsz" data-rsz="' + c.id +
      '" title="Drag the edge to resize — the dashed line shows where it will land. ' +
      'Double-click it to fit the column to its widest value."></span>';
    html += '</th>';
  });
  html += '</tr></thead><tbody>';
  const rowIds = pageRowIds();
  rowIds.forEach((r, ri) => {
    html += '<tr class="' + (isRowSelected(r) ? 'rowsel' : '') + '">' +
      '<td class="selcell" style="' + selStyle + '">' +
      '<span class="selinner"><button class="rowbox ' + (isRowSelected(r) ? 'on' : '') +
      '" data-selrow="' + r + '" role="checkbox" aria-checked="' + isRowSelected(r) +
      '" aria-label="Select row ' + (r+1) + '">' +
      (isRowSelected(r) ? '✓' : '') + '</button></span></td>';
    cols.forEach((c, i) => {
      const lastPin = c.pinned && (!cols[i+1] || !cols[i+1].pinned);
      if (c.collapsed) {
        // one cell for the whole strip, so no row lines cut across the title
        if (ri === 0) html += '<td class="cstrip ' + (c.pinned ? 'pinned ' : '') + (lastPin ? 'pinedge' : '') +
          '" rowspan="' + rowIds.length + '" data-expand="' + c.id + '" title="Expand ' + esc(lab(c.id)) + '"' +
          (c.pinned ? ' style="left:' + leftOf[c.id] + 'px"' : '') + '><span class="vlab">' + esc(lab(c.id)) + '</span></td>';
        return;
      }
      html += '<td class="' + (c.pinned ? 'pinned ' : '') + (lastPin ? 'pinedge ' : '') + (c.collapsed ? 'collapsed' : '') + '"' +
        (c.pinned ? ' style="left:' + leftOf[c.id] + 'px"' : '') + '>' +
        (c.collapsed ? '' : '<div class="cv" style="width:' + (c.width - 24) + 'px" title="' +
        esc(cellText(r, c.id)) + '">' + esc(cellText(r, c.id)) + '</div>') + '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  sc.appendChild(el(html));
  sw.appendChild(sc);
  wrap.appendChild(sw);

  const from = pageIndex() * pageSize() + 1;
  const to = pageIndex() * pageSize() + rowsOnPage();
  const pg = el('<div class="pager"></div>');
  pg.appendChild(el('<span class="pgl">' + (rowsOnPage() ? from + '–' + to : '0') +
    ' ' + esc('of') + ' ' + matchedTotal() + ' ' + esc('rows') + '</span>'));
  pg.appendChild(el('<span class="spacer"></span>'));
  const prev = el('<button class="pgb"' + (pageIndex() === 0 ? ' disabled' : '') +
    ' aria-label="Previous page">‹</button>');
  prev.onclick = () => goPage(pageIndex() - 1);
  pg.appendChild(prev);
  pg.appendChild(el('<span class="pgn">' + esc('Page') + ' ' + (pageIndex() + 1) +
    ' ' + esc('of') + ' ' + pageCount() + '</span>'));
  const next = el('<button class="pgb"' + (pageIndex() >= pageCount() - 1 ? ' disabled' : '') +
    ' aria-label="Next page">›</button>');
  next.onclick = () => goPage(pageIndex() + 1);
  pg.appendChild(next);
  pg.appendChild(el('<span>' + pageSize() + ' a page</span>'));
  wrap.appendChild(pg);

  /* interactions */
  const sa = sc.querySelector('[data-selall]');
  if (sa) sa.onclick = ev => { ev.stopPropagation(); toggleAllRows(); };
  sc.querySelectorAll('[data-selrow]').forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    toggleRow(parseInt(b.dataset.selrow, 10));
  });
  sc.querySelectorAll('[data-unpin]').forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    togglePin(b.dataset.unpin);
  });
  sc.querySelectorAll('[data-expand]').forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    S.colMenu = null; S.grpMenu = null;
    setCollapsed(b.dataset.expand, false);
  });
  sc.querySelectorAll('[data-sort]').forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    S.colMenu = null; S.grpMenu = null;
    cycleSort(b.dataset.sort);
  });
  /* The options that used to sit behind the three dots open on right-click.
     The context-menu key and Shift+F10 on a focused title do the same, so the
     menu is still reachable from the keyboard. */
  const menuAt = (ev, el0) => {
    if (ev.clientX || ev.clientY) return { x: ev.clientX, y: ev.clientY };
    const r = el0.getBoundingClientRect();
    return { x: r.left, y: r.bottom + 4 };
  };
  sc.querySelectorAll('th[data-col]').forEach(th => th.addEventListener('contextmenu', ev => {
    ev.preventDefault(); ev.stopPropagation();
    const p = menuAt(ev, th);
    S.grpMenu = null;
    S.colMenu = { id: th.dataset.col,
      x: Math.min(p.x, window.innerWidth - 248),
      y: Math.min(p.y, window.innerHeight - 300) };
    commit('Options for ' + lab(th.dataset.col));
  }));
  sc.querySelectorAll('th[data-band]').forEach(th => th.addEventListener('contextmenu', ev => {
    ev.preventDefault(); ev.stopPropagation();
    if (th.dataset.band === '__pinned') return;
    const p = menuAt(ev, th);
    S.colMenu = null;
    S.grpMenu = { cid: th.dataset.band,
      x: Math.min(p.x, window.innerWidth - 268),
      y: Math.min(p.y, window.innerHeight - 340) };
    commit('Options for the ' + catName(th.dataset.band) + ' group');
  }));

  // drag a whole group along the band row
  sc.querySelectorAll('[data-bgrab]').forEach(h => {
    h.addEventListener('pointerdown', ev => {
      ev.preventDefault(); ev.stopPropagation();
      const cid = h.dataset.bgrab;
      document.body.classList.add('dragging');
      const chip = el('<div class="dragchip"><span style="color:#9a9a9a;display:inline-flex">' + ICON.grip + '</span><span>' +
        esc(catName(cid)) + ' group</span><span id="gno"></span></div>');
      document.body.appendChild(chip);
      const zoneEls = [];
      let pinW = 0;
      runs.forEach(r => { if (r.key === '__pinned') pinW = r.w; });
      const total = runs.reduce((a, r) => a + r.w, SELW);
      if (pinW) {
        const d1 = el('<div class="dimzone"></div>');
        d1.style.left = '0'; d1.style.width = (SELW + pinW) + 'px';
        sw.appendChild(d1); zoneEls.push(d1);
      }
      const z = el('<div class="okzone"></div>');
      z.style.left = (SELW + pinW) + 'px'; z.style.width = (total - SELW - pinW) + 'px';
      sw.appendChild(z); zoneEls.push(z);
      const lab = el('<div class="zonelabel">Groups reorder here — never left of the pinned columns</div>');
      lab.style.left = (SELW + pinW) + 'px'; lab.style.top = '-26px';
      sw.appendChild(lab); zoneEls.push(lab);
      let line = null, barrier = null, ok = false, overCid = null;

      const mv2 = e2 => {
        chip.style.left = (e2.clientX + 14) + 'px';
        chip.style.top = (e2.clientY - 16) + 'px';
        const node = document.elementFromPoint(e2.clientX, e2.clientY);
        const bandTh = node && node.closest ? node.closest('th[data-band]') : null;
        const colTh = node && node.closest ? node.closest('th[data-col]') : null;
        let key = bandTh ? bandTh.dataset.band : null;
        if (!key && colTh) {
          const cc = cols.find(c => c.id === colTh.dataset.col);
          key = cc ? (cc.pinned ? '__pinned' : cc.cat) : null;
        }
        if (line) { line.remove(); line = null; }
        if (barrier) { barrier.remove(); barrier = null; }
        const no = document.getElementById('gno');
        ok = false; overCid = null;
        if (!key || key === cid) { if (no) { no.className=''; no.textContent=''; } return; }
        if (key === '__pinned') {
          if (no) { no.className = 'no'; no.textContent = 'CANNOT DROP HERE'; }
          barrier = el('<div class="barrier"></div>');
          barrier.style.left = (SELW + pinW - 2) + 'px';
          sw.appendChild(barrier);
          return;
        }
        ok = true; overCid = key;
        if (no) { no.className=''; no.textContent=''; }
        let x = SELW;
        for (let ri = 0; ri < runs.length; ri++) { if (runs[ri].key === key) break; x += runs[ri].w; }
        line = el('<div class="dropline"></div>');
        line.style.left = (x - 1.5) + 'px';
        line.style.top = '0';
        sw.appendChild(line);
      };
      let ended2 = false;
      const finish2 = (commitIt) => {
        if (ended2) return;
        ended2 = true;
        document.removeEventListener('pointermove', mv2);
        document.removeEventListener('pointerup', up2);
        document.removeEventListener('pointercancel', cancel2);
        window.removeEventListener('blur', cancel2);
        chip.remove(); zoneEls.forEach(z2 => z2.remove());
        if (line) line.remove(); if (barrier) barrier.remove();
        document.body.classList.remove('dragging');
        if (commitIt && ok && overCid) dropGroupBefore(cid, overCid);
        else { render(); announce('Group move cancelled'); }
      };
      const up2 = () => finish2(true);
      const cancel2 = () => finish2(false);
      document.addEventListener('pointermove', mv2);
      document.addEventListener('pointerup', up2);
      document.addEventListener('pointercancel', cancel2);
      window.addEventListener('blur', cancel2);
      try { h.setPointerCapture(ev.pointerId); } catch (e) {}
      mv2(ev);
    });
  });

  // resize
  sc.querySelectorAll('[data-rsz]').forEach(g => {
    g.addEventListener('pointerdown', ev => {
      ev.preventDefault(); ev.stopPropagation();
      const id = g.dataset.rsz;
      /* Excel: double-click the edge and the column snaps to fit its content.
         Detected here rather than with a dblclick event, because the table is
         rebuilt between the two clicks and the element the first click landed
         on no longer exists by the second. */
      const now = Date.now();
      if (lastEdgeClick && lastEdgeClick.id === id && now - lastEdgeClick.t < 450) {
        lastEdgeClick = null;
        return autosizeColumn(id);
      }
      lastEdgeClick = { id, t: now };
      const th = sc.querySelector('th[data-col="' + id + '"]');
      const startX = ev.clientX, startW = th.offsetWidth;
      const top = (grouped ? 30 : 0) + 'px';
      const b0 = sw.getBoundingClientRect();
      const thb = th.getBoundingClientRect();
      const edge0 = thb.right - b0.left;            // where the edge is now

      // the edge you started from stays visible, so the move is legible
      const origin = el('<div class="rszorigin"></div>');
      origin.style.top = top; origin.style.left = edge0 + 'px';
      sw.appendChild(origin);

      const guide = el('<div class="rszguide"></div>');
      guide.style.top = top;
      sw.appendChild(guide);

      const label = el('<div class="rszlabel"></div>');
      label.style.top = (grouped ? 4 : 4) + 'px';
      sw.appendChild(label);

      document.body.classList.add('resizing');
      resizing = id;
      let lastW = startW, done = false, moved = false;
      /* hold the guides back until the pointer has actually travelled, so the
         first click of a double click does not flash them on and off */
      [guide, origin, label].forEach(n => { n.style.display = 'none'; });

      const place = w => {
        const x = edge0 + (w - startW);
        guide.style.left = x + 'px';
        label.style.left = Math.max(34, Math.min(sw.clientWidth - 34, x)) + 'px';
        label.textContent = 'Width: ' + Math.round(w) + ' px' +
          (w === 96 ? ' (minimum)' : w === 420 ? ' (maximum)' : '');
      };
      place(startW);
      // the column itself is left alone until you let go, exactly as Excel does
      const mv = e2 => {
        if (!moved && Math.abs(e2.clientX - startX) < 3) return;
        if (!moved) { moved = true; lastEdgeClick = null; [guide, origin, label].forEach(n => { n.style.display = ''; }); }
        const w = Math.max(W_MIN, Math.min(W_MAX, startW + (e2.clientX - startX)));
        lastW = w;
        place(w);
      };
      const end = (commitIt) => {
        if (done) return;
        done = true;
        document.removeEventListener('pointermove', mv);
        document.removeEventListener('pointerup', up);
        document.removeEventListener('pointercancel', cancel);
        window.removeEventListener('blur', cancel);
        guide.remove(); origin.remove(); label.remove();
        document.body.classList.remove('resizing');
        resizing = null;
        if (commitIt && moved && Math.abs(lastW - startW) > 2) setWidth(id, lastW);
        else if (moved) render();
      };
      const up = () => end(true);
      const cancel = () => end(false);
      document.addEventListener('pointermove', mv);
      document.addEventListener('pointerup', up);
      document.addEventListener('pointercancel', cancel);
      window.addEventListener('blur', cancel);
      try { g.setPointerCapture(ev.pointerId); } catch (e) {}
    });
  });

  // drag to move
  sc.querySelectorAll('[data-grab]').forEach(h => {
    h.addEventListener('pointerdown', ev => {
      ev.preventDefault(); ev.stopPropagation();
      const fid = h.dataset.grab;
      drag = { fid, overId:null, ok:false };
      document.body.classList.add('dragging');
      const chip = el('<div class="dragchip"><span style="color:#9a9a9a;display:inline-flex">' + ICON.grip + '</span><span>' + esc(lab(fid)) + '</span><span id="chipno"></span></div>');
      document.body.appendChild(chip);
      const pinsNow = pinnedList();
      const fPinned = pinsNow.indexOf(fid) !== -1;
      const groupedNow = isGrouped();

      // allowed zone + dimming
      const zoneEls = [];
      const allCols = tableColumns();
      const sx = () => sc.scrollLeft;
      let acc = SELW, zoneStart = null, zoneEnd = null;
      allCols.forEach(c => {
        const same = fPinned ? c.pinned
          : (!c.pinned && (groupedNow ? c.cat === F[fid].cat : true));
        if (same) { if (zoneStart === null) zoneStart = acc; zoneEnd = acc + c.width; }
        acc += c.width;
      });
      const total = acc;
      let zoneEl = null, labEl = null, dimA = null, dimB = null;
      if (zoneStart !== null) {
        zoneEl = el('<div class="okzone"></div>');
        sw.appendChild(zoneEl); zoneEls.push(zoneEl);
        labEl = el('<div class="zonelabel">' + (fPinned ? 'Pinned — reorder within the pinned columns'
          : (groupedNow ? esc(catName(F[fid].cat)) + ' — move within this group only'
                        : 'Groups are off — move it anywhere')) + '</div>');
        labEl.style.top = '-26px';
        sw.appendChild(labEl); zoneEls.push(labEl);
        dimA = el('<div class="dimzone"></div>'); sw.appendChild(dimA); zoneEls.push(dimA);
        dimB = el('<div class="dimzone"></div>'); sw.appendChild(dimB); zoneEls.push(dimB);
      }
      const viewW = sw.clientWidth;
      const placeZones = () => {
        if (!zoneEl) return;
        const off = sx();
        const a = Math.max(0, zoneStart - off), b = Math.min(viewW, zoneEnd - off);
        zoneEl.style.left = a + 'px';
        zoneEl.style.width = Math.max(0, b - a) + 'px';
        labEl.style.left = Math.max(0, a) + 'px';
        dimA.style.left = '0px';
        dimA.style.width = Math.max(0, a) + 'px';
        dimB.style.left = b + 'px';
        dimB.style.width = Math.max(0, viewW - b) + 'px';
      };
      placeZones();
      sc.addEventListener('scroll', placeZones);
      let line = null, barrier = null;

      const mv = e2 => {
        chip.style.left = (e2.clientX + 14) + 'px';
        chip.style.top = (e2.clientY - 16) + 'px';
        const th = document.elementFromPoint(e2.clientX, e2.clientY);
        const cell = th && th.closest ? th.closest('th[data-col]') : null;
        const overId = cell ? cell.dataset.col : null;
        drag.overId = overId;
        if (line) { line.remove(); line = null; }
        if (barrier) { barrier.remove(); barrier = null; }
        const no = document.getElementById('chipno');
        drag.ok = false;
        if (!overId || overId === fid) { if (no) no.textContent = ''; return; }
        const tPinned = pinsNow.indexOf(overId) !== -1;
        const okSame = fPinned ? tPinned
          : (!tPinned && (groupedNow ? F[overId].cat === F[fid].cat : true));
        if (okSame) {
          drag.ok = true;
          if (no) { no.textContent = ''; no.className = ''; }
          const b = sw.getBoundingClientRect();
          const cb = cell.getBoundingClientRect();
          line = el('<div class="dropline"></div>');
          line.style.left = (cb.left - b.left - 1.5) + 'px';
          line.style.top = (grouped ? 30 : 0) + 'px';
          sw.appendChild(line);
        } else {
          if (no) { no.className = 'no'; no.textContent = 'CANNOT DROP HERE'; }
          if (tPinned && !fPinned) {
            let acc2 = SELW, edge = SELW;
            allCols.forEach(c => { if (c.pinned) edge = acc2 + c.width; acc2 += c.width; });
            barrier = el('<div class="barrier"></div>');
            barrier.style.left = (edge - sx() - 2) + 'px';
            sw.appendChild(barrier);
          }
        }
      };
      let ended = false;
      const finish = (commitIt) => {
        if (ended) return;
        ended = true;
        document.removeEventListener('pointermove', mv);
        document.removeEventListener('pointerup', up);
        document.removeEventListener('pointercancel', cancel);
        window.removeEventListener('blur', cancel);
        sc.removeEventListener('scroll', placeZones);
        chip.remove(); zoneEls.forEach(z => z.remove());
        if (line) line.remove(); if (barrier) barrier.remove();
        document.body.classList.remove('dragging');
        const d = drag; drag = null;
        if (commitIt && d && d.ok && d.overId) dropBefore(d.fid, d.overId);
        else { render(); announce('Move cancelled'); }
      };
      const up = () => finish(true);
      const cancel = () => finish(false);
      document.addEventListener('pointermove', mv);
      document.addEventListener('pointerup', up);
      document.addEventListener('pointercancel', cancel);
      window.addEventListener('blur', cancel);
      try { h.setPointerCapture(ev.pointerId); } catch (e) {}
      mv(ev);
    });
  });

  return wrap;
}

let mdrag = null;

/* ---------- modal ---------- */
function openModal() {
  S.menuOpen = true;
  S.colMenu = null; S.grpMenu = null;
  forgetScroll('modal-list');
  commit('Hidden columns');
}
function closeModal() {
  S.menuOpen = false;
  commit('Hidden columns closed');
}
function allCollapsed() { return CATS.every(c => S.collapsed[c.id]); }

/* ---------- dev panel ---------- */
function renderDev() {
  const d = $('dev');
  d.className = S.devMin ? 'min' : '';
  d.innerHTML = '';
  const h = el('<header><span>Prototype controls</span></header>');
  const t = el('<button aria-label="Toggle">' + (S.devMin ? '▲' : '▼') + '</button>');
  t.onclick = () => { S.devMin = !S.devMin; commit(); };
  h.appendChild(t); d.appendChild(h);
  if (S.devMin) return;
  const b = el('<div class="db"></div>');
  const row = el('<div class="row"></div>');
  const st = el('<button class="mini">' + (S.devState ? 'Hide' : 'Show') + ' state</button>');
  st.onclick = () => { S.devState = !S.devState; commit(); };
  const rs = el('<button class="mini">Reset everything</button>');
  rs.onclick = () => {
    const keep = { devMin:S.devMin, devState:S.devState };
    S = seed(); Object.assign(S, keep);
    toastMsg = null; commit('Reset to the default columns');
  };
  row.appendChild(st); row.appendChild(rs);
  b.appendChild(row);
  if (S.devState) {
    b.appendChild(el('<pre>' + esc(JSON.stringify({
      grouped: isGrouped(),
      pinned: pinnedList(),
      groupOrder: catOrder().map(c => catName(c)),
      hiddenGroups: hiddenGroups(),
      hiddenColumns: FIELDS.filter(f => !visibleOf(f.id)).map(f => f.id),
      widths: S.cols.widths,
      collapsed: Object.keys(S.cols.collapsed).filter(k => S.cols.collapsed[k]),
      aliases: S.cols.alias
    }, null, 2)) + '</pre>'));
  }
  d.appendChild(b);
}

/* Every change rebuilds the DOM, which would otherwise throw you back to the
   top of the list the moment you tick anything. Scroll positions are captured
   before the rebuild and put back after it. */
const scrollMemo = {};
function captureScroll() {
  document.querySelectorAll('[data-scroll]').forEach(n => {
    scrollMemo[n.dataset.scroll] = { t: n.scrollTop, l: n.scrollLeft };
  });
}
function restoreScroll() {
  document.querySelectorAll('[data-scroll]').forEach(n => {
    const m = scrollMemo[n.dataset.scroll];
    if (!m) return;
    if (m.t) n.scrollTop = m.t;
    if (m.l) n.scrollLeft = m.l;
  });
}
function forgetScroll(key) { delete scrollMemo[key]; }

/* A drag that never gets its pointerup — pointer capture lost, window blurred,
   the tab switched — used to leave the floating chip and the zone overlays
   stranded on top of everything. Nothing else can clear them, so every render
   sweeps them away unless a drag is genuinely in progress. */
function dragActive() { return !!(drag || mdrag || resizing); }
function sweepDragFurniture() {
  if (dragActive()) return;
  document.querySelectorAll('.dragchip, .dimzone, .okzone, .zonelabel, .dropline, .barrier, ' +
    '.rszguide, .rszorigin, .rszlabel').forEach(n => n.remove());
  document.body.classList.remove('dragging');
  document.body.classList.remove('resizing');
}


/* ---------- render ---------- */
function render() {
  sweepDragFurniture();
  captureScroll();
  const sh = $('shell');
  sh.innerHTML = '';
  sh.appendChild(renderAppbar());
  sh.appendChild(renderToolbar());
  sh.appendChild(renderTable());

  const ov = $('overlay'); ov.innerHTML = '';
  if (S.menuOpen) ov.appendChild(columnsModal());
  const cmEl = renderColMenu();
  if (cmEl) ov.appendChild(cmEl);
  const gmEl = renderGrpMenu();
  if (gmEl) ov.appendChild(gmEl);
  const tw = $('toastwrap'); tw.innerHTML = '';
  if (toastMsg) {
    const t = el('<div id="toast" role="status"><span>✓</span><span>' + esc(toastMsg) + '</span></div>');
    const b = el('<button>Dismiss</button>');
    b.onclick = () => { toastMsg = null; render(); };
    t.appendChild(b); tw.appendChild(t);
  }
  applyScale();
  renderDev();
  restoreScroll();
}

/* A read-only hook so the prototype can be driven and inspected by a test
   harness. The dev panel already shows this state; this just makes it reachable
   from outside the script. */
window.__debug = {
  get S() { return S; },
  F, FIELDS, CATS, CATNAME,
  render, change, dropBefore, pinnedList, isGrouped, tableColumns, visibleOf, widthOf,
  catIsHidden, catCanHide, togglePin, setVisible, toggleGrouping, toggleCategory, lab, catName,
  canUnpin, showGroupAndUnpin, setCollapsed, setGroupCollapsed, isCollapsed, cycleSort, viewRows, sortDirOf, hiddenThings, hiddenCount, showEverything,
  allHiddenColumns, hiddenGroups, restoreAllCount,
  autosizeColumn, autosizeAll, fittedWidth, setWidth, headerNeed, naturalWidth,
  catOrder, flatOrder, aliasOf, setAlias, canonLab, openModal, closeModal
};

document.addEventListener('click', () => {
  let ch = false;
  if (S.colMenu) { S.colMenu = null; ch = true; }
  if (S.grpMenu) { S.grpMenu = null; ch = true; }
  if (ch) commit();
});
document.addEventListener('contextmenu', () => {
  if (S.colMenu || S.grpMenu) { S.colMenu = null; S.grpMenu = null; commit(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (S.colMenu || S.grpMenu) { S.colMenu = null; S.grpMenu = null; return commit(); }
    if (S.menuOpen) closeModal();
  }
});

render();
</script>
</body>
